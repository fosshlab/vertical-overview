name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended questions or ideas you'd like to discuss first, please use [Discussions](https://github.com/fosshlab/vertical-overview/discussions). English or Spanish are both fine.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: GNOME Shell version you use
      placeholder: GNOME Shell 42.9
